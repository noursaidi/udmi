name: UDMI Container Image Release

on:
  push:
    branches:
      - master
  workflow_dispatch:


jobs:

  build_packages:
    name: Build Java Packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
      - name: Build Java Packages
        run: |
          bin/clone_model
          udmis/bin/build check
          validator/bin/build check
          pubber/bin/build check
          services/bin/build check
      - name: Upload prebuilt packages
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: udmi-prebuilt-packages
          path: |
            udmis/build/libs/
            validator/build/libs/
            pubber/build/libs/
            services/build/libs/

  images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: build_packages
    permissions:
      contents: read
      packages: write
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        container: [ "udmis", "validator", "pubber", "services" ]
    env:
      PUSH_REGISTRY: ghcr.io
      CONTAINER: ${{ matrix.container }}
      REF_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Log in to the github registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.PUSH_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download prebuilt packages
        uses: actions/download-artifact@v8
        with:
          name: udmi-prebuilt-packages
      - name: Convert repository name to lowercase
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
      - name: Container build and push
        run: |
          TAG=${REF_NAME//\//-}
          [[ $REF_NAME == master ]] && TAG=latest
          IMAGE_REF=$PUSH_REGISTRY/$GITHUB_REPOSITORY_OWNER/udmi/$CONTAINER:$TAG

          bin/container $CONTAINER push --no-check $IMAGE_REF

          echo Pushed built $CONTAINER container as $IMAGE_REF | tee -a $GITHUB_STEP_SUMMARY

  monolith:
    name: Build monolithic distroless image
    runs-on: ubuntu-latest
    needs: build_packages
    permissions:
      contents: read
      packages: write
    timeout-minutes: 10
    env:
      PUSH_REGISTRY: ghcr.io
      REF_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6
      - name: Log in to the github registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.PUSH_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download prebuilt packages
        uses: actions/download-artifact@v8
        with:
          name: udmi-prebuilt-packages
      - name: build and push image
        run: |
          IMAGE_REF="$PUSH_REGISTRY/$GITHUB_REPOSITORY_OWNER/udmi/monolith"
          IMAGE_TAG=${REF_NAME//\//-}
          [[ $REF_NAME == master ]] && IMAGE_TAG=latest
          docker build -t $IMAGE_REF:$IMAGE_TAG -f etc/Dockerfile.monolith .
          docker push $IMAGE_REF:$IMAGE_TAG
          echo Pushed built monolith container as $IMAGE_REF:$IMAGE_TAG | tee -a $GITHUB_STEP_SUMMARY

  discovery:
    name: Build and deploy discovery node image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    permissions:
      contents: read
      packages: write
    timeout-minutes: 10
    env:
      PUSH_REGISTRY: ghcr.io
      REF_NAME: ${{ github.ref_name }}
      BUILDENV: ${{ matrix.environments }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Log in to the github registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.PUSH_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build and push image
        run: |
          IMAGE_REF="$PUSH_REGISTRY/$GITHUB_REPOSITORY_OWNER/udmi/discoverynode"
          IMAGE_TAG=${REF_NAME//\//-}
          [[ $REF_NAME == master ]] && IMAGE_TAG=latest
          ./misc/discoverynode/bin/build_container_and_push $IMAGE_REF:$IMAGE_TAG
          echo Pushed built discoverynode container as $IMAGE_REF:$IMAGE_TAG | tee -a $GITHUB_STEP_SUMMARY

  spotter:
    name: Build and deploy spotter image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    permissions:
      contents: read
      packages: write
    timeout-minutes: 10
    env:
      PUSH_REGISTRY: ghcr.io
      REF_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Log in to the github registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.PUSH_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build and push image
        run: |
          IMAGE_REF="$PUSH_REGISTRY/$GITHUB_REPOSITORY_OWNER/udmi/spotter"
          IMAGE_TAG=${REF_NAME//\//-}
          [[ $REF_NAME == master ]] && IMAGE_TAG=latest
          docker build -t $IMAGE_REF:$IMAGE_TAG -f edge/spotter/container/Dockerfile .
          docker push $IMAGE_REF:$IMAGE_TAG
          echo Pushed built spotter container as $IMAGE_REF:$IMAGE_TAG | tee -a $GITHUB_STEP_SUMMARY
 
